<style>
/* Misma línea visual que la app Toma datos: barra roja con chevrones, tarjetas y barra de acción fija abajo */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --red:#E3384C; --red-ink:#FFFFFF; --red-soft:#3A1C22; --amber:#FFC94D; --amber-soft:#3A3120; --ok:#52C78F; --ok-soft:#163325;
  --water:#6AA9F5; --water-soft:#18283D; --chev:#E9ECEF; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{

  --red:#E3384C; --red-ink:#FFFFFF; --red-soft:#3A1C22; --amber:#FFC94D; --amber-soft:#3A3120; --ok:#52C78F; --ok-soft:#163325;
  --water:#6AA9F5; --water-soft:#18283D; --chev:#E9ECEF; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;font-weight:600;font-size:.92rem}

.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cifra{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}

<script>
'use strict';
/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const hoyIso = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const ahora = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fCorta = iso => { const [y, m, d] = iso.split('-'); return `${d}/${m}/${y.slice(2)}`; };
const fLarga = iso => { const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
const DIAS = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
const DIA_TXT = { lunes: 'lunes', martes: 'martes', miercoles: 'miércoles', jueves: 'jueves', viernes: 'viernes', sabado: 'sábado', domingo: 'domingo' };
const diaDe = iso => DIAS[new Date(iso + 'T12:00').getDay()];
const miles = n => Number(n || 0).toLocaleString('es-MX');
const APP = !!window.AB_APP;
const LOGO = window.AB_LOGO || '';
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2400); }
function copiar(t) { try { navigator.clipboard.writeText(t).then(() => toast('Texto copiado'), () => toast('No se pudo copiar')); } catch (e) { toast('No se pudo copiar'); } }

/* ============ Datos guardados en el teléfono ============ */
/* Cada base tiene su pipa; todas son de 9,000 L */
const PIPA_DE = { 'Base 1': '8442', 'Base 2': '8444', 'Base 3': '8445', 'Base 4': '8446', 'Base 5': '8443' };
const BASES = Object.keys(PIPA_DE);
const CAPACIDAD = 9000;
const ALMAC = [
  { id: 'garrafon', txt: 'Garrafón', plural: 'garrafones' },
  { id: 'tinaco', txt: 'Tinaco', plural: 'tinacos' },
  { id: 'aljibe', txt: 'Aljibe', plural: 'aljibes' },
  { id: 'cisterna', txt: 'Cisterna', plural: 'cisternas' },
  { id: 'otro', txt: 'Otro', plural: 'recipientes' },
  { id: 'recipientes', txt: 'Recipientes', plural: 'recipientes', soloPunto: true } // la gente llega con sus recipientes al punto de llenado
];
const TINACOS = [450, 750, 1100];
const COLOR_BASE = { 1: '#B05CC6', 2: '#C99A00', 3: '#4E9A2E', 4: '#6E7B87', 5: '#E07020' };
const CLAVE_LS = 'abasto.v1';
let DB = { turno: {}, cfg: {}, entregas: [], puntos: [], fotos: {}, borrar: [] };
let guardaOK = true;
function cargar() {
  try { const o = JSON.parse(localStorage.getItem(CLAVE_LS) || 'null'); if (o) DB = { turno: o.turno || {}, cfg: o.cfg || {}, entregas: o.entregas || [], puntos: o.puntos || [], fotos: o.fotos || {}, borrar: o.borrar || [] }; }
  catch (e) { guardaOK = false; }
  const t = DB.turno; t.pipa = PIPA_DE[t.base] || ''; delete t.punto; delete t.capacidad;
}
function guardar() { try { localStorage.setItem(CLAVE_LS, JSON.stringify(DB)); } catch (e) { guardaOK = false; } }
const registroURL = () => ((window.AB_REGISTRO && window.AB_REGISTRO.url) || '').trim();
const registroClave = () => ((window.AB_REGISTRO && window.AB_REGISTRO.clave) || '').trim();

/* ============ Fotos de evidencia ============ */
/* La imagen va en IndexedDB (localStorage no alcanza); en DB.fotos solo queda si ya se subió y su liga */
let idbP;
const idb = () => idbP || (idbP = new Promise((ok, no) => {
  const r = indexedDB.open('abasto', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('fotos');
  r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
}));
async function fotoPut(id, data) { const d = await idb(); return new Promise((ok, no) => { const t = d.transaction('fotos', 'readwrite'); t.objectStore('fotos').put(data, id); t.oncomplete = ok; t.onerror = () => no(t.error); }); }
async function fotoGet(id) { const d = await idb(); return new Promise((ok, no) => { const r = d.transaction('fotos').objectStore('fotos').get(id); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); }
async function fotoDel(id) { const d = await idb(); return new Promise(ok => { const t = d.transaction('fotos', 'readwrite'); t.objectStore('fotos').delete(id); t.oncomplete = ok; t.onerror = ok; }); }
const fotoCache = {};
/* Se reduce a 1280 px y calidad media: unos 200 KB, para que suba aunque haya poca señal */
async function comprimir(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const k = Math.min(1, 1280 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.6);
  } finally { URL.revokeObjectURL(url); }
}
function fotosHTML(ids, para) {
  return `<div class="fotos">${(ids || []).map(id => `<figure class="foto"><img data-foto="${id}" alt="Foto de evidencia"><button type="button" class="quitar" data-quitafoto="${id}" data-para="${para}" aria-label="Quitar foto">×</button></figure>`).join('')}<button type="button" class="btn" data-tomarfoto="${para}">Tomar foto</button></div>`;
}
async function hidratarFotos() {
  for (const img of document.querySelectorAll('img[data-foto]')) {
    if (img.getAttribute('src')) continue;
    const id = img.dataset.foto, d = fotoCache[id] || await fotoGet(id).catch(() => null);
    if (d) { fotoCache[id] = d; img.src = d; }
  }
}
const fotosUrl = ids => (ids || []).map(id => (DB.fotos[id] || {}).url).filter(Boolean);
/* Fotos por subir y a qué renglones pertenecen (solo cuando esos renglones ya están en la hoja) */
function fotosPorSubir() {
  const out = [];
  DB.entregas.forEach(e => (e.fotos || []).forEach(id => { const m = DB.fotos[id]; if (m && !m.subida && e.enviado) out.push({ id, fecha: fLarga(e.fecha), ids: [e.id] }); }));
  DB.puntos.forEach(p => (p.fotos || []).forEach(id => {
    const m = DB.fotos[id], ids = DB.entregas.filter(e => e.punto === p.id && e.enviado).map(e => e.id);
    if (m && !m.subida && ids.length) out.push({ id, fecha: fLarga(p.fecha), ids });
  }));
  return out;
}

/* ============ Zonas del SIAPA y colonias ============ */
const SI = window.SIAPA;
const pt = (r, i) => [SI.lat0 + r[i] / SI.esc, SI.lon0 + r[i + 1] / SI.esc];
const anilloLL = r => { const o = []; for (let i = 0; i < r.length; i += 2) o.push(pt(r, i)); return o; };
function dentro(lat, lon, r) {
  let si = false;
  for (let i = 0, j = r.length - 2; i < r.length; j = i, i += 2) {
    const yi = SI.lat0 + r[i] / SI.esc, xi = SI.lon0 + r[i + 1] / SI.esc, yj = SI.lat0 + r[j] / SI.esc, xj = SI.lon0 + r[j + 1] / SI.esc;
    if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) si = !si;
  }
  return si;
}
const enPoligono = (lat, lon, pol) => dentro(lat, lon, pol[0]) && !pol.slice(1).some(h => dentro(lat, lon, h));
/* Caja de cada colonia para descartar rápido */
const CAJAS = SI.colonias.r.map(rs => { let a = 1e9, b = -1e9, c = 1e9, d = -1e9; rs.forEach(r => { for (let i = 0; i < r.length; i += 2) { a = Math.min(a, r[i]); b = Math.max(b, r[i]); c = Math.min(c, r[i + 1]); d = Math.max(d, r[i + 1]); } }); return [a, b, c, d]; });
function lugarDe(lat, lon) {
  const zona = SI.zonas.find(z => z.p.some(p => enPoligono(lat, lon, p)));
  const y = (lat - SI.lat0) * SI.esc, x = (lon - SI.lon0) * SI.esc;
  let col = null;
  for (let i = 0; i < CAJAS.length; i++) {
    const k = CAJAS[i]; if (y < k[0] || y > k[1] || x < k[2] || x > k[3]) continue;
    if (SI.colonias.r[i].some(r => dentro(lat, lon, r))) { col = i; break; }
  }
  /* Base o módulo que cubre el punto (si cae en un módulo, ese; si no, la base) */
  const cobs = SI.coberturas.filter(c => c.p.some(r => dentro(lat, lon, r)));
  const cob = cobs.find(c => c.modulo) || cobs[0];
  return {
    cobertura: cob ? cob.nombre : '',
    zona: zona ? zona.z : '', zonaNombre: zona ? zona.nombre : '',
    colonia: col == null ? '' : titulo(SI.colonias.n[col]), municipio: col == null ? '' : SI.colonias.m[col]
  };
}
const titulo = s => String(s || '').toLowerCase().replace(/(^|[\s.(])(\S)/g, (_, a, b) => a + b.toUpperCase()).replace(/\b(De|Del|La|Las|Los|El|Y)\b/g, w => w.toLowerCase()).replace(/^./, c => c.toUpperCase());
const sinServicio = (z, iso) => !!z && (SI.dias[z] || []).includes(diaDe(iso));
const diasTxt = z => (SI.dias[z] || []).map(d => DIA_TXT[d]).join(', ');
/* Zona por nombre de colonia, cuando no hay GPS */
function zonaPorColonia(nombre) {
  const k = norm(nombre); if (!k) return '';
  const i = SI.colonias.n.findIndex(n => norm(n) === k);
  return i < 0 ? '' : String(SI.colonias.z[i] || '').split(',')[0];
}

/* ============ Estado de la pantalla ============ */
const S = { view: 'home', e: null, p: null, pf: null, gps: 'nada', mapa: null, todas: null, verTodas: false, fotoPara: '' };

/* Entrega nueva: si se pide «aquí mismo», hereda lugar y ubicación de la anterior */
function nuevaEntrega(aqui) {
  const t = DB.turno, prev = aqui ? DB.entregas[DB.entregas.length - 1] : null;
  const e = { id: uid(), fecha: hoyIso(), hora: ahora(), tipoLugar: 'casa', lugar: '', domicilio: '', colonia: '', municipio: '', zona: '', recibe: '', telefono: '',
    almac: '', cantidad: 1, tamano: 0, litros: 0, notas: '', gps: null, enviado: false };
  if (prev) ['tipoLugar', 'lugar', 'colonia', 'municipio', 'zona', 'cobertura', 'gps', 'almac', 'tamano'].forEach(k => { e[k] = prev[k]; });
  if (e.almac === 'aljibe' || e.almac === 'cisterna' || e.almac === 'otro') e.litros = 0;
  return e;
}
function litrosDe(e) {

}

/* Se intenta leer la respuesta; si el navegador no deja, se manda igual sin leerla (el registro ignora repetidos) */
async function postRegistro(cuerpo) {
  const opts = { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ clave: registroClave(), ...cuerpo }) };
  try { const r = await fetch(registroURL(), opts); return await r.json(); }
  catch (err) { await fetch(registroURL(), { ...opts, mode: 'no-cors' }); return { ok: true }; }
}
const pendientes = () => DB.entregas.filter(e => !e.enviado).length + DB.borrar.length + fotosPorSubir().length;
async function enviarPendientes(silencio) {
  if (!registroURL() || enviando || !pendientes()) return;
  if (!navigator.onLine) { if (!silencio) toast('Sin señal: se envían solas cuando regrese'); return; }
  enviando = true;
  try {
    const pend = DB.entregas.filter(e => !e.enviado), borrar = DB.borrar.slice();
    if (pend.length || borrar.length) {
      const r = await postRegistro({ entregas: pend.map(filaRegistro), borrar });
      if (!r.ok) throw new Error(r.error);
      pend.forEach(e => { e.enviado = true; }); DB.borrar = DB.borrar.filter(x => !borrar.includes(x)); guardar();
    }
    for (const f of fotosPorSubir()) {
      const data = fotoCache[f.id] || await fotoGet(f.id).catch(() => null);
      if (!data) { DB.fotos[f.id].subida = true; continue; } // la imagen ya no está en el teléfono
      const r = await postRegistro({ fotos: [{ ...f, base64: data.split(',')[1] }] });
      if (!r.ok) throw new Error(r.error);
      DB.fotos[f.id] = { subida: true, url: (r.urls || {})[f.id] || '' }; guardar();
    }
    if (!silencio) toast('Todo enviado al registro');
  } catch (err) { if (!silencio) toast('No se pudo enviar. Se reintenta solo.'); }
  enviando = false;
  if (S.view === 'home') render(false);
}

        <span class="meta"><span class="mono">${esc(e.hora)}</span>${e.domicilio ? `<span>${esc(e.domicilio)}</span>` : ''}${e.telefono ? `<span>${esc(e.telefono)}</span>` : ''}</span>
        <div class="acts"><button type="button" class="btn ghost" data-quitapersona="${e.id}">Quitar</button></div></article>`).join('') : '<div class="empty">Agrega a cada persona conforme se le llenan sus recipientes.</div>'}</div>
    </section>
  </main>
  <datalist id="dl-colonias"></datalist>
  <div class="bar"><div class="wrap"><button type="button" class="btn big grow" data-act="salirpunto">Terminar punto</button></div></div>`;
}
const DATOS_PUNTO = ['lugar', 'colonia', 'municipio', 'zona', 'cobertura', 'gps'];
function nuevoPunto() { return { id: uid(), fecha: hoyIso(), hora: ahora(), lugar: '', colonia: '', municipio: '', zona: '', cobertura: '', gps: null, fotos: [] }; }
function abrirPunto(p) { S.p = p; S.e = null; S.pf = { recibe: '', domicilio: '', telefono: '', litros: 0 }; S.gps = p.gps ? 'ok' : 'nada'; S.view = 'punto'; render(); if (!p.gps) tomarGPS(p); }
/* Al salir del punto, sus personas toman el nombre, la colonia y la ubicación finales del punto */
function cerrarPunto() {
  const p = S.p, gente = DB.entregas.filter(e => e.punto === p.id);
  gente.forEach(e => { DATOS_PUNTO.forEach(k => { if (JSON.stringify(e[k]) !== JSON.stringify(p[k])) { e[k] = p[k]; e.enviado = false; } }); if (e.lugar !== p.lugar) { e.lugar = p.lugar; e.enviado = false; } });
  if (!gente.length && !(p.fotos || []).length) DB.puntos = DB.puntos.filter(x => x.id !== p.id);
  guardar(); enviarPendientes(true);
  S.p = null; S.view = 'home'; render();
}
function quitarFotos(ids) { ids.forEach(id => { if (DB.fotos[id] && !DB.fotos[id].subida) { delete DB.fotos[id]; fotoDel(id).catch(() => {}); } }); }
function faltan(e) {
  const f = [];
  if (!e.recibe.trim()) f.push('quién recibe');
  if (!e.almac) f.push('qué se llenó');
  if (!litrosDe(e)) f.push('los litros');
  if (!e.gps && !e.domicilio.trim() && !(e.tipoLugar === 'lugar' && e.lugar.trim())) f.push('el domicilio o la ubicación');
  return f;
}
function viewMapa() {
  const iso = hoyIso();
  return `<div class="topbar"><div class="wrap"><button type="button" class="back" data-go="home" aria-label="Volver">‹</button><h2>Tandeo y entregas</h2></div></div>
  <main class="wrap">
    <div id="mapa" class="mapa alto" role="application" aria-label="Mapa de zonas del tandeo y entregas"></div>
    <div class="leyenda">${SI.zonas.slice().sort((a, b) => a.z - b.z).map(z => `<span class="ley"><i style="background:${z.color};opacity:${sinServicio(z.z, iso) ? 1 : .35}"></i>Zona ${z.z}${sinServicio(z.z, iso) ? ' · sin servicio' : ''}</span>`).join('')}<span class="ley"><i class="dot" style="background:#1E6FD9;border:2px solid #fff;box-shadow:0 0 0 1px #1E6FD9"></i>Entrega</span><span class="ley"><i class="dot" style="background:#5AA0F2"></i>Garza</span><span class="ley"><i class="dot" style="background:#C3132B"></i>Base</span>${[1, 2, 3, 4, 5].map(b => `<span class="ley"><i style="border:3px solid ${COLOR_BASE[b]};background:transparent"></i>Cobertura Base ${b}</span>`).join('')}</div>
    ${registroURL() ? `<div class="row"><button type="button" class="btn" data-act="todas" aria-pressed="${S.verTodas}">${S.verTodas ? 'Ver solo mis entregas' : 'Ver las de todas las pipas'}</button><span class="hint" id="todas-estado"></span></div>` : ''}
    <span class="hint">Las zonas en color fuerte no tienen servicio hoy (${esc(titulo(DIA_TXT[diaDe(iso)]))}). Los contornos son las coberturas de cada base (punteado: módulos). El color de relleno es la zona del tandeo, solo dentro de Guadalajara. Toca una zona para ver sus días de corte.</span>
  </main>`;
}

/* ============ Mapa ============ */
function cargarLeaflet() {
  if (window.L) return Promise.resolve();
  return new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
}
async function pintarMapa() {
  const el = $('#mapa'); if (!el) return;
  try { await cargarLeaflet(); } catch (err) { el.innerHTML = '<div class="empty">No se pudo cargar el mapa. Revisa tu conexión.</div>'; return; }
  if (!el.isConnected) return;
  if (S.mapa) { try { S.mapa.remove(); } catch (err) {} }
  const m = L.map(el).setView([20.67, -103.35], 11); S.mapa = m;
  /* Abierta como archivo, algunos servidores bloquean sus mapas: ahí se empieza con Esri. Se puede cambiar y se recuerda */
  const fondos = {
    'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }),
    'OSM Francia': L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', { subdomains: 'abc', maxZoom: 20, attribution: '© OpenStreetMap France · © OpenStreetMap' }),
    'Esri': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Mapa © Esri' })
  };
  (fondos[DB.cfg.fondoMapa] || fondos[location.protocol === 'file:' ? 'Esri' : 'OpenStreetMap']).addTo(m);
  L.control.layers(fondos, null, { collapsed: innerWidth < 700 }).addTo(m);
  m.on('baselayerchange', ev => { DB.cfg.fondoMapa = ev.name; guardar(); });
  const iso = hoyIso(), tandeo = L.featureGroup().addTo(m), cober = L.featureGroup().addTo(m);
  /* Zonas del tandeo: solo relleno. Coberturas de bases y módulos: solo contorno, con el color de la base, como en Toma datos */
  SI.zonas.forEach(z => {
    const corte = sinServicio(z.z, iso);
    L.polygon(z.p.map(p => p.map(anilloLL)), { stroke: false, fillColor: z.color, fillOpacity: corte ? .45 : .12 })
      .bindPopup(`<b>Zona ${z.z} · ${esc(z.nombre)}</b><br>Sin servicio: ${esc(diasTxt(z.z))}<br>${corte ? '<b>Hoy sin servicio</b>' : 'Hoy con servicio'}`).addTo(tandeo);
  });
  SI.coberturas.forEach(c => L.polygon(c.p.map(r => [anilloLL(r)]), { color: COLOR_BASE[c.base], weight: c.modulo ? 2 : 3.5, dashArray: c.modulo ? '6 5' : null, fill: false })
    .bindTooltip(c.nombre, { sticky: true }).addTo(cober));
  L.control.layers(null, { 'Zonas del tandeo': tandeo, 'Coberturas de bases y módulos': cober }, { collapsed: innerWidth < 700, position: 'bottomleft' }).addTo(m).getContainer().classList.add('capas');
  /* Perímetro de las coberturas de Guadalajara: las zonas del SIAPA ya vienen recortadas a él */
  const per = L.polygon(SI.perimetro.map(p => p.map(anilloLL)), { stroke: false, fill: false, interactive: false }).addTo(m);
  SI.garzas.forEach(g => L.circleMarker(g.pos, { radius: 6, color: '#1E6FD9', weight: 2, fillColor: '#5AA0F2', fillOpacity: .95 }).bindPopup(`<b>${esc(g.nombre)}</b>${g.dir ? '<br>' + esc(g.dir) : ''}<br><a href="https://www.google.com/maps/dir/?api=1&destination=${g.pos.join(',')}" target="_blank" rel="noopener">Cómo llegar</a>`).addTo(m));
  SI.bases.forEach(b => L.circleMarker(b.pos, { radius: b.tipo === 'base' ? 8 : 5, color: '#fff', weight: 2, fillColor: '#C3132B', fillOpacity: 1 }).bindTooltip(b.nombre.replace('Módulo ', ''), { direction: 'right' }).addTo(m));
  m.createPane('entregas').style.zIndex = 660;
  S.capa = L.layerGroup().addTo(m);
  pintarEntregas();
  m.fitBounds(per.getBounds(), { padding: [10, 10] });
}
function pintarEntregas() {
  if (!S.capa) return;
  S.capa.clearLayers();
  const puntos = DB.puntos.filter(p => p.fecha === hoyIso() && p.gps).map(p => {
    const gente = DB.entregas.filter(e => e.punto === p.id);
    return { p: [p.gps.lat, p.gps.lon], html: `<b>${esc(p.lugar || 'Punto de llenado')}</b><br>Punto de llenado · ${gente.length} ${gente.length === 1 ? 'persona' : 'personas'}<br><b>${miles(gente.reduce((s, e) => s + litrosDe(e), 0))} L</b>` };
  });
  const mias = hoyLista().filter(e => e.gps && !e.punto).map(e => ({ p: [e.gps.lat, e.gps.lon], html: `<b>${esc(e.tipoLugar === 'lugar' && e.lugar ? e.lugar : e.recibe)}</b><br>${esc(e.hora)} · ${esc(almacTxt(e))}<br><b>${miles(litrosDe(e))} L</b>` }));
  const coords = x => (String(x['Ubicación'] || '').match(/q=(-?[\d.]+),(-?[\d.]+)/) || []).slice(1).map(Number);
  const otras = S.verTodas && S.todas ? S.todas.filter(x => coords(x).length === 2 && !DB.entregas.some(e => e.id === x.id)).map(x => ({ p: coords(x), html: `<b>Pipa ${esc(x.Pipa)}</b> · ${esc(x.Hora)}<br>${esc(x['Lugar o institución'] || x.Colonia)}<br>${esc(x.Almacenamiento)} · <b>${miles(x.Litros)} L</b>` })) : [];
  [...mias, ...puntos, ...otras].forEach(x => L.circleMarker(x.p, { pane: 'entregas', radius: 7, color: '#fff', weight: 2, fillColor: '#1E6FD9', fillOpacity: 1 }).bindPopup(x.html).addTo(S.capa));
}
async function cargarTodas() {
  const el = $('#todas-estado'); if (el) el.textContent = 'Cargando…';
  try {
    const r = await fetch(`${registroURL()}?clave=${encodeURIComponent(registroClave())}&fecha=${encodeURIComponent(fLarga(hoyIso()))}`);
    const o = await r.json(); if (!o.ok) throw new Error(o.error);
    S.todas = o.entregas; if (el) el.textContent = `${o.entregas.length} entregas de todas las pipas hoy.`;
  } catch (err) { S.todas = null; if (el) el.textContent = 'No se pudieron traer las del registro.'; }
  pintarEntregas();
}

/* ============ Render y eventos ============ */
function render(arriba = true) {
  $('#app').innerHTML = S.view === 'turno' ? viewTurno() : S.view === 'entrega' ? viewEntrega() : S.view === 'punto' ? viewPunto() : S.view === 'mapa' ? viewMapa() : viewHome();
  if (S.view === 'mapa') pintarMapa(); else if (S.mapa) { try { S.mapa.remove(); } catch (err) {} S.mapa = null; S.capa = null; }
  if (S.view === 'entrega' || S.view === 'punto') llenarColonias();
  hidratarFotos();
  historial();
  if (arriba) window.scrollTo(0, 0);
}
/* Botón «atrás» del teléfono: desde una pantalla interna regresa al inicio en vez de cerrar la app */
let volviendo = false;
function historial() {
  const sub = S.view !== 'home', hay = history.state && history.state.sub;
  if (sub && !hay) history.pushState({ sub: 1 }, '');
  else if (!sub && hay) { volviendo = true; history.back(); }
}
window.addEventListener('popstate', () => {
  if (volviendo) { volviendo = false; return; }
  if (S.view === 'punto' && S.p) { cerrarPunto(); return; }
  if (S.view === 'entrega' && S.e) {
    const e = S.e, guardada = DB.entregas.some(x => x.id === e.id);
    if (!guardada && (e.recibe.trim() || e.domicilio.trim()) && !confirm('¿Salir sin guardar esta entrega?')) { history.pushState({ sub: 1 }, ''); return; }
    const b = document.querySelector('[data-act=cancelar]'); if (b) { b.click(); return; }
  }
  S.view = 'home'; render();
});
/* En la app Android el botón «atrás» lo recibe Capacitor: en el inicio cierra la app, en lo demás regresa */
const appNativa = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
if (appNativa) appNativa.addListener('backButton', () => { if (S.view === 'home') appNativa.exitApp(); else history.back(); });
function llenarColonias() {
  const dl = $('#dl-colonias'); if (!dl || dl.childElementCount) return;
  const nombres = [...new Set(SI.colonias.n.filter((n, i) => /guadalajara|tlaquepaque|tonal|zapopan/i.test(SI.colonias.m[i])).map(titulo))].sort((a, b) => a.localeCompare(b, 'es'));
  dl.innerHTML = nombres.map(n => `<option value="${esc(n)}">`).join('');
}
function abrirEntrega(e) { S.e = e; S.gps = e.gps ? 'ok' : 'nada'; S.view = 'entrega'; render(); if (!e.gps) tomarGPS(e); }
function refrescarCant() { const e = S.e, c = $('#cant'); if (c) c.innerHTML = cantidadHTML(e); const t = $('#tot'); if (t) t.textContent = miles(litrosDe(e)) + ' L'; }
const app = $('#app');
app.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  const ds = b.dataset, e = S.e, t = DB.turno;
  if (ds.go) { S.view = ds.go; render(); return; }
  if ((ds.act === 'nueva' || ds.act === 'punto') && !t.pipa) { S.view = 'turno'; render(); toast('Primero elige tu base'); return; }
  if (ds.act === 'nueva') { abrirEntrega(nuevaEntrega(false)); return; }
  if (ds.act === 'punto') { const p = nuevoPunto(); DB.puntos.push(p); guardar(); abrirPunto(p); return; }
  if (ds.punto) { const p = DB.puntos.find(x => x.id === ds.punto); if (p) abrirPunto(p); return; }
  if (ds.tomarfoto) { S.fotoPara = ds.tomarfoto; $('#foto-in').value = ''; $('#foto-in').click(); return; }
  if (ds.quitafoto) {
    const o = ds.para === 'p' ? S.p : S.e; if (!o) return;
    o.fotos = (o.fotos || []).filter(id => id !== ds.quitafoto);
    if (ds.para === 'p') { quitarFotos([ds.quitafoto]); guardar(); }
    render(false); return;
  }
  if (S.view === 'punto' && S.p) {
    const p = S.p, f = S.pf;
    if (ds.act === 'gps') { tomarGPS(p); return; }
    if (ds.plit) { f.litros = +ds.plit; app.querySelectorAll('[data-plit]').forEach(c => c.setAttribute('aria-pressed', c === b)); $('#pf-litros').value = ''; return; }
    if (ds.act === 'agregarpersona') {
      if (!f.recibe.trim()) { toast('Escribe el nombre'); $('#pf-recibe').focus(); return; }
      if (!p.zona && p.colonia) p.zona = zonaPorColonia(p.colonia);
      const e = { id: uid(), fecha: p.fecha, hora: ahora(), tipoLugar: 'lugar', lugar: p.lugar, domicilio: f.domicilio.trim(), recibe: f.recibe.trim(), telefono: f.telefono.trim(),
        almac: 'recipientes', cantidad: 1, tamano: 0, litros: +f.litros || 0, notas: '', fotos: [], punto: p.id, enviado: false };
      DATOS_PUNTO.forEach(k => { e[k] = p[k]; });
      DB.entregas.push(e); guardar(); enviarPendientes(true);
      S.pf = { recibe: '', domicilio: '', telefono: '', litros: f.litros };
      render(false); toast(`${e.recibe} agregada`); const n = $('#pf-recibe'); if (n) { n.scrollIntoView({ block: 'center' }); n.focus(); }
      return;
    }
    if (ds.quitapersona) {
      const x = DB.entregas.find(y => y.id === ds.quitapersona); if (!x || !confirm(`¿Quitar a ${x.recibe}?`)) return;
      DB.entregas = DB.entregas.filter(y => y !== x); if (x.enviado) DB.borrar.push({ id: x.id, fecha: fLarga(x.fecha) });
      guardar(); enviarPendientes(true); render(false); return;
    }
    if (ds.act === 'salirpunto') { cerrarPunto(); return; }
  }
  if (ds.edit) { const x = DB.entregas.find(y => y.id === ds.edit); if (x) abrirEntrega(JSON.parse(JSON.stringify(x))); return; }
  if (ds.act === 'enviar') { enviarPendientes(false); return; }
  if (ds.act === 'todas') { S.verTodas = !S.verTodas; b.setAttribute('aria-pressed', S.verTodas); b.textContent = S.verTodas ? 'Ver solo mis entregas' : 'Ver las de todas las pipas'; if (S.verTodas) cargarTodas(); else { const el = $('#todas-estado'); if (el) el.textContent = ''; pintarEntregas(); } return; }
  if (ds.base) { t.base = ds.base; t.pipa = PIPA_DE[ds.base]; guardar(); render(false); return; }
  if (!e) return;
  if (ds.act === 'gps') { tomarGPS(e); return; }
  if (ds.tl) { e.tipoLugar = ds.tl; render(false); return; }
  if (ds.almac) { e.almac = ds.almac; e.cantidad = e.cantidad || 1; if (ds.almac === 'tinaco' && !e.tamano) e.tamano = 0; refrescarCant(); app.querySelectorAll('[data-almac]').forEach(x => x.setAttribute('aria-pressed', x.dataset.almac === e.almac)); return; }
  if (ds.tam) { e.tamano = +ds.tam; refrescarCant(); return; }
  if (ds.lit) { e.litros = +ds.lit; refrescarCant(); return; }
  if (ds.step) { e[ds.step] = Math.max(1, (e[ds.step] || 1) + +ds.d); refrescarCant(); return; }
  if (ds.act === 'cancelar') {
    const guardada = DB.entregas.find(x => x.id === e.id);
    quitarFotos((e.fotos || []).filter(id => !(guardada && (guardada.fotos || []).includes(id)))); // fotos tomadas y no guardadas
    S.e = null; S.view = 'home'; render(); return;
  }
  if (ds.act === 'borrar') {
    if (!confirm('¿Borrar esta entrega?')) return;
    const x = DB.entregas.find(y => y.id === e.id);
    DB.entregas = DB.entregas.filter(y => y.id !== e.id); quitarFotos(e.fotos || []);
    if (x && x.enviado) DB.borrar.push({ id: x.id, fecha: fLarga(x.fecha) });
    guardar(); enviarPendientes(true); S.e = null; S.view = 'home'; render(); toast('Entrega borrada'); return;
  }
  if (ds.act === 'guardar' || ds.act === 'guardarotra') {
    const f = faltan(e);
    if (f.length && !confirm(`Falta ${f.join(', ')}. ¿Guardar así?`)) return;
    if (!e.zona && e.colonia) e.zona = zonaPorColonia(e.colonia);
    const i = DB.entregas.findIndex(x => x.id === e.id);
    if (i >= 0) { quitarFotos((DB.entregas[i].fotos || []).filter(id => !(e.fotos || []).includes(id))); e.enviado = false; DB.entregas[i] = e; } else DB.entregas.push(e);
    guardar(); enviarPendientes(true);
    if (ds.act === 'guardarotra') { abrirEntrega(nuevaEntrega(true)); toast('Guardada. Sigue con la siguiente'); }
    else { S.e = null; S.view = 'home'; render(); toast('Entrega guardada'); }
  }
});
app.addEventListener('input', ev => {
  const x = ev.target, ds = x.dataset;
  if (ds.t) { DB.turno[ds.t] = x.value.trim(); guardar(); return; }
  if (ds.pk && S.p) { S.p[ds.pk] = x.value; if (ds.pk === 'colonia' && !S.p.gps) S.p.zona = zonaPorColonia(x.value); guardar(); return; }
  if (ds.pf && S.pf) { if (ds.pf === 'litros') { S.pf.litros = +x.value.replace(/\D/g, '') || 0; app.querySelectorAll('[data-plit]').forEach(c => c.setAttribute('aria-pressed', 'false')); } else S.pf[ds.pf] = x.value; return; }
  const e = S.e; if (!e || !ds.k) return;
  if (ds.k === 'tamanoOtro') { e.tamano = +x.value.replace(/\D/g, '') || 0; app.querySelectorAll('[data-tam]').forEach(c => c.setAttribute('aria-pressed', 'false')); }
  else if (ds.k === 'litros') { e.litros = +x.value.replace(/\D/g, '') || 0; app.querySelectorAll('[data-lit]').forEach(c => c.setAttribute('aria-pressed', 'false')); }
  else { e[ds.k] = x.value; if (ds.k === 'colonia' && !e.gps) e.zona = zonaPorColonia(x.value); }
  const tt = $('#tot'); if (tt) tt.textContent = miles(litrosDe(e)) + ' L';
});

/* Foto tomada con la cámara: se reduce, se guarda en el teléfono y se liga a la entrega o al punto abierto */
$('#foto-in').addEventListener('change', async ev => {
  const file = ev.target.files && ev.target.files[0], o = S.fotoPara === 'p' ? S.p : S.e; if (!file || !o) return;
  try {
    const data = await comprimir(file), id = uid();
    fotoCache[id] = data;
    try { await fotoPut(id, data); } catch (err) { toast('La foto no se pudo guardar en el teléfono; mándala antes de cerrar'); }
    DB.fotos[id] = { subida: false, url: '' };
    o.fotos = [...(o.fotos || []), id];
    guardar(); render(false);
    if (S.fotoPara === 'p') enviarPendientes(true);
  } catch (err) { toast('No se pudo leer la foto'); }
});

cargar(); render(); enviarPendientes(true);
</script>
